<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MERIDIAN — Personal &amp; Academic OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#6366f1;--bg:#fff7e6;--card:#fff;--ink:#1f1b2e;--mut:#6b6580;--line:#1f1b2e;--sh:#1f1b2e;--soft:#f3ecdd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14121f;--card:#1e1b2e;--ink:#f4f1ff;--mut:#a29cc0;--line:#4a4468;--sh:var(--acc);--soft:#2a2640}}
:root[data-theme=dark]{--bg:#14121f;--card:#1e1b2e;--ink:#f4f1ff;--mut:#a29cc0;--line:#4a4468;--sh:var(--acc);--soft:#2a2640}
[data-accent=emerald]{--acc:#10b981}[data-accent=violet]{--acc:#8b5cf6}[data-accent=amber]{--acc:#f59e0b}[data-accent=rose]{--acc:#f43f5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 Fredoka,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}h2,h3{margin:0}h2{font-size:22px}
.app{display:flex;min-height:100vh;position:relative;z-index:1}.col{flex:1;min-width:0}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100dvh;width:230px;flex:none;background:var(--card);border-right:3px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto;z-index:30}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:700;letter-spacing:.08em}.logo i{width:34px;height:34px;border-radius:10px;background:var(--acc);border:2.5px solid var(--line);display:grid;place-items:center;font-style:normal;animation:wig 4s infinite}
.nv{text-align:left;background:none;border:2px solid transparent;border-radius:12px;padding:8px 10px;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}.nv:hover{transform:translateX(4px)}.nv.on{background:var(--soft);border-color:var(--line);font-weight:700}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:3px solid var(--line)}
main{padding:20px;max-width:1100px;margin:0 auto}.menu{display:none}
.c{background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:5px 5px 0 var(--sh);transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s}
.k{cursor:pointer}.k:hover{transform:translate(-2px,-3px) rotate(-.5deg);box-shadow:8px 8px 0 var(--sh)}.sel{outline:3px solid var(--acc)}
.b{background:var(--acc);color:#fff;border:2.5px solid var(--line);border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:600;box-shadow:3px 3px 0 var(--sh);transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s}.b.g{background:var(--soft);color:var(--ink)}
.b:hover{transform:translateY(-2px) scale(1.05) rotate(-1deg)}.b:active{transform:translate(3px,3px) scale(.96);box-shadow:none}
.i{width:100%;border:2px solid var(--line);background:var(--soft);border-radius:10px;padding:7px 10px}textarea.i{resize:vertical;font-family:ui-monospace,monospace}
input[type=checkbox]{accent-color:var(--acc);transform:scale(1.3)}
.stack{display:grid;gap:14px}.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g7{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mut{color:var(--mut)}small{font-size:12px}.acc{color:var(--acc)}.big{font-size:28px;font-weight:700}.done{text-decoration:line-through;opacity:.55}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--soft);border:2px solid var(--line)}.tag.ok{background:#10b98144}.tag.High{background:#f43f5e44}
.x{background:none;border:0;cursor:pointer;color:var(--mut)}.x:hover{color:#f43f5e}.lk{background:none;border:0;color:var(--acc);cursor:pointer;font-weight:600}
.mini{padding:8px 10px;margin-top:8px;background:var(--soft);border-radius:12px;border:2px solid var(--line)}.today{outline:3px dashed var(--acc)}
.bar{height:12px;border-radius:9px;background:var(--soft);border:2px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transform-origin:left;animation:grow 1s backwards}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}td,th{padding:9px 8px;text-align:left;border-bottom:2px dashed var(--soft)}.tdy{background:var(--soft)}
.hc{width:34px;height:34px;border-radius:10px;border:2.5px solid var(--line);background:var(--soft);cursor:pointer;color:#fff;font-weight:700;transition:transform .15s cubic-bezier(.34,1.56,.64,1)}.hc:hover{transform:scale(1.15)}.hc.on{background:var(--acc)}
.empty{text-align:center;border-style:dashed;color:var(--mut)}.empty::before{content:"🌱";display:block;font-size:2rem;animation:bob 2s ease-in-out infinite}
.dot{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);cursor:pointer}
#mo{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:60}#mo.show{display:flex}
#mb{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:20px;box-shadow:8px 8px 0 var(--sh);display:grid;gap:12px;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
#tc{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:grid;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;border:2px solid var(--line);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
#bd{position:fixed;inset:0;background:#0007;z-index:25;display:none}#bd.show{display:block}
#doodles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}#doodles span{position:absolute;font-size:2.2rem;opacity:.16;animation:flt 9s ease-in-out infinite}
.mero{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.mero svg{overflow:visible}.mb{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}.me{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.bub{position:relative;background:#fff;color:#1f1b2e;border:2.5px solid #1f1b2e;border-radius:16px;padding:5px 11px;font-size:12px;font-weight:600;max-width:140px;box-shadow:3px 3px 0 #1f1b2e}.bub.say{animation:say .4s cubic-bezier(.34,1.56,.64,1)}
.conf{position:fixed;width:10px;height:10px;border-radius:3px;border:2px solid #1f1b2e;pointer-events:none;z-index:100}
.pop-in{animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(14px)}to{opacity:1;transform:none}}
@keyframes flt{50%{transform:translateY(-26px) rotate(8deg)}}@keyframes grow{from{transform:scaleX(0)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes wig{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}94%{transform:rotate(10deg)}}
@keyframes say{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}}
@media(max-width:860px){aside{position:fixed;left:0;top:0;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:transform .25s}aside.open{transform:none}.menu{display:inline-flex}}
@media(max-width:700px){.split{grid-template-columns:1fr}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div id="doodles"></div><div id="tc"></div><div id="bd" onclick="menu(0)"></div><div id="mo" onclick="if(event.target===this)shut()"><div id="mb"></div></div>
<div class="app"><aside id="side"><div class="logo"><i>🧭</i><div>MERIDIAN<br><small class="mut" id="tb"></small></div></div><nav id="nav" class="stack" style="gap:3px"></nav></aside>
<div class="col"><header><div class="row"><button class="b g menu" onclick="menu(1)">☰</button><h2 id="ht"></h2></div><div class="row"><small class="mut" id="dt"></small><button class="b g" onclick="flip()" title="Light / dark">🌗</button><b id="av" class="tag"></b><small id="un"></small></div></header><main id="main"></main></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const KEY='meridian_cartoon_v1',DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],TI=(new Date().getDay()+6)%7,today=()=>new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const NAV=[['dashboard','🏠','Dashboard'],['tasks','✅','My Tasks'],['planner','🗓️','Academic Planner'],['subjects','📚','Subjects & Notes'],['assignments','📝','Assignments'],['habits','⚡','Habits'],['skills','🛠️','Skill Development'],['goals','🎯','Goals'],['journal','📓','Journal'],['analytics','📊','Analytics'],['settings','⚙️','Settings']];
const D={route:'dashboard',filter:'All',sub:null,note:null,jr:null,week:'',set:{name:'Alex Rivera',term:'Fall 2026',theme:'auto',accent:'indigo',target:25,email:''},cls:[],tasks:[],blocks:[],subjects:[],asg:[],skills:[],goals:[],journal:[],
habits:[{id:'h1',name:'Deep Study Block (90m)',days:Array(7).fill(false)},{id:'h2',name:'Solve 2 Practice Problems',days:Array(7).fill(false)}]};
let S;try{S={...structuredClone(D),...JSON.parse(localStorage.getItem(KEY)||'{}')};S.set={...D.set,...S.set}}catch(e){S=structuredClone(D)}
const wk=(()=>{const d=new Date();d.setDate(d.getDate()-TI);return d.toDateString()})();
if(S.week!==wk){S.habits.forEach(h=>h.days=Array(7).fill(false));S.week=wk}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let anim=true,last={x:innerWidth/2,y:innerHeight/2},tmp=[],mi=0;const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
document.addEventListener('click',e=>last={x:e.clientX,y:e.clientY},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
const streak=h=>{let i=h.days[TI]?TI:TI-1,n=0;while(i>=0&&h.days[i]){n++;i--}return n};
const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`,lvl=p=>p<34?'Beginner':p<67?'Intermediate':'Advanced';
const head=(t,s,b='')=>`<div class="row sp"><div><h2>${t}</h2><div class="mut">${s}</div></div>${b}</div>`,empty=m=>`<div class="c empty">${m}</div>`;
const MSG=['Hi! Ready to study? 📚','You’ve got this! 💪','Tiny steps count! 🐾','Time for some water! 💧','Tick a task, get confetti! 🎉'];
const MERO=`<div class="mero" onclick="say(this)" title="Click me!"><svg viewBox="0 0 100 104" width="80" height="84"><g class="mb"><path d="M50 14C76 14 92 32 92 58c0 24-17 38-42 38S8 82 8 58C8 32 24 14 50 14Z" fill="var(--acc)" stroke="#1f1b2e" stroke-width="4"/><g class="me"><ellipse cx="35" cy="56" rx="9" ry="11" fill="#fff" stroke="#1f1b2e" stroke-width="3"/><ellipse cx="65" cy="56" rx="9" ry="11" fill="#fff" stroke="#1f1b2e" stroke-width="3"/><circle cx="37" cy="58" r="4.5" fill="#1f1b2e"/><circle cx="63" cy="58" r="4.5" fill="#1f1b2e"/></g><path d="M38 74Q50 86 62 74" fill="none" stroke="#1f1b2e" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="70" r="5" fill="#fda4af"/><circle cx="76" cy="70" r="5" fill="#fda4af"/><path d="M20 28L50 14L80 28L50 42Z" fill="#1f1b2e"/><path d="M76 30v14" stroke="#f59e0b" stroke-width="3"/><circle cx="76" cy="46" r="3.5" fill="#f59e0b"/></g></svg><div class="bub">${MSG[0]}</div></div>`;
function say(el){const b=el.querySelector('.bub');b.textContent=MSG[++mi%MSG.length];b.classList.remove('say');void b.offsetWidth;b.classList.add('say');if(!calm)el.querySelector('svg').animate([{transform:'none'},{transform:'translateY(-16px) rotate(-6deg)'},{transform:'none'}],{duration:450,easing:'ease-out'})}
function boom(){if(calm)return;const c=['#f43f5e','#f59e0b','#10b981','#6366f1','#8b5cf6'];for(let i=0;i<22;i++){const p=document.createElement('i');p.className='conf';p.style.cssText=`left:${last.x}px;top:${last.y}px;background:${c[i%5]}`;document.body.appendChild(p);const a=Math.random()*6.28,d=60+Math.random()*90;p.animate([{transform:'none',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+60}px) rotate(${Math.random()*720}deg) scale(.6)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#tc').appendChild(t);setTimeout(()=>t.remove(),2400)}
const shut=()=>$('#mo').classList.remove('show'),menu=o=>{$('#side').classList.toggle('open',!!o);$('#bd').classList.toggle('show',!!o)};
function form(title,fields,fn){$('#mb').innerHTML=`<h3>${title}</h3><form id="mf" class="stack">${fields.map(f=>`<label>${f.l}${f.o?`<select class="i" id="f_${f.k}">${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input class="i" id="f_${f.k}" type="${f.t||'text'}" placeholder="${f.p||''}" value="${E(f.v)}" ${f.r===false?'':'required'}>`}</label>`).join('')}<div class="row"><button type="button" class="b g" onclick="shut()">Cancel</button><button class="b">Save</button></div></form>`;
$('#mf').onsubmit=e=>{e.preventDefault();const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k).value.trim());fn(v);save();shut();render()};$('#mo').classList.add('show')}
const del=(l,i)=>{S[l]=S[l].filter(x=>x.id!==i);save();render()},tog=(l,i,k)=>{const o=S[l].find(x=>x.id===i);o[k]=!o[k];save();render();if(o[k])boom()};
function go(r){S.route=r;anim=true;save();menu(0);scrollTo(0,0);render()}
function flip(){const dark=S.set.theme==='dark'||(S.set.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);S.set.theme=dark?'light':'dark';save();render()}

function v_dashboard(){const pend=S.tasks.filter(t=>!t.done),act=S.asg.filter(a=>a.st!=='Submitted').sort((a,b)=>a.due.localeCompare(b.due)),hrs=S.subjects.reduce((s,x)=>s+x.hrs,0),mx=Math.max(0,...S.habits.map(streak));
const k=(l,v,s,r)=>`<div class="c k" onclick="go('${r}')"><div class="mut">${l}</div><div class="big">${v}</div><div class="mut">${s}</div></div>`;
return `<div class="stack"><div class="c row sp"><div class="row">${MERO}<div><small class="mut">${E(S.set.term)}</small><h2>Welcome back, ${E(S.set.name.split(' ')[0])}!</h2><div class="mut">${pend.length} pending tasks · ${act.length} active assignments</div></div></div><div class="row"><button class="b g" onclick="go('tasks')">+ Quick Task</button><button class="b" onclick="go('subjects')">Add Subject</button></div></div>
<div class="c row sp"><div><h3>🎓 Classroom courses ${S.set.email?'<span class="tag ok">● Added</span>':'<span class="tag">Setup</span>'}</h3><div class="mut">${S.set.email?`${S.cls.length} courses saved for ${E(S.set.email)}`:'Add your Google Classroom courses and they become subjects automatically.'}</div></div><button class="b" onclick="clsModal()">${S.set.email?'Manage courses':'Add courses'}</button></div>
<div class="g">${k('Pending Tasks',pend.length,`${S.tasks.length-pend.length} completed`,'tasks')}${k('Assignments',act.length,'Next due: '+(act[0]?.due||'All clear'),'assignments')}${k('Top Habit Streak',mx+' 🔥','days in a row','habits')}<div class="c k" onclick="go('analytics')"><div class="mut">Total Study Hours</div><div class="big">${hrs}h <small class="mut">/ ${S.set.target}h</small></div>${bar(hrs/S.set.target*100)}</div></div>
<div class="g"><div class="c"><h3>Today’s focus</h3>${pend.length?pend.slice(0,5).map(t=>`<label class="mini row"><input type="checkbox" onchange="tog('tasks','${t.id}','done')"> ${E(t.title)} <span class="tag">${E(t.tag)}</span></label>`).join(''):'<div class="mut">Nothing pending. 🎉</div>'}</div>
<div class="c"><h3>Active assignments</h3>${act.length?act.slice(0,4).map(a=>`<div class="mini"><b class="acc">${E(a.sub)}</b> · due ${E(a.due)}<br>${E(a.title)}</div>`).join(''):'<div class="mut">No active assignments.</div>'}</div></div></div>`}
function clsModal(){tmp=[...S.cls];drawCls()}
function drawCls(){const em=$('#ce')?.value??S.set.email;$('#mb').innerHTML=`<h3>🎓 Classroom courses</h3><div class="mut">Type in the courses from your Google Classroom. Each one becomes a subject.</div><input class="i" id="ce" type="email" placeholder="student@university.edu" value="${E(em)}"><div class="row"><input class="i" id="cn" placeholder="Data Structures" style="flex:2 1 140px"><input class="i" id="cc" placeholder="CS301" style="flex:1 1 80px"><button class="b" onclick="addCls()">Add</button></div>${tmp.map((c,i)=>`<div class="mini row sp"><b class="acc">${E(c.code)}</b><span>${E(c.name)}</span><button class="x" onclick="tmp.splice(${i},1);drawCls()">✕</button></div>`).join('')}<div class="row"><button class="b g" onclick="shut()">Cancel</button><button class="b" onclick="saveCls()">Save</button></div>`;$('#mo').classList.add('show')}
function addCls(){const name=$('#cn').value.trim(),code=$('#cc').value.trim().toUpperCase();if(name&&code)tmp.push({name,code});drawCls()}
function saveCls(){const em=$('#ce').value.trim();if(!em)return toast('Enter your email first');S.set.email=em;S.cls=[...tmp];tmp.forEach(c=>{if(!S.subjects.some(s=>s.code===c.code))S.subjects.push({id:uid(),code:c.code,name:c.name,hrs:0,notes:[{id:uid(),title:'Syllabus',upd:today(),body:`# ${c.name} (${c.code})\n\n`}]})});save();shut();render();toast('Courses saved!')}

function v_tasks(){const f=S.filter,l=S.tasks.filter(t=>f==='Pending'?!t.done:f==='High'?t.pri==='High'&&!t.done:f==='Done'?t.done:1);
return `<div class="stack">${head('My Tasks','Organize daily action items and course tags.')}<div class="row">${[['All','All'],['Pending','Pending'],['High','High Priority'],['Done','Completed']].map(([k,n])=>`<button class="b ${f===k?'':'g'}" onclick="S.filter='${k}';save();render()">${n}</button>`).join('')}</div>
<form class="c row" onsubmit="addTask(event)"><input class="i" id="tt" required placeholder="Add a new task…" style="flex:2 1 200px"><input class="i" id="tg" placeholder="Tag e.g. CS301" style="flex:1 1 110px"><select class="i" id="tp" style="flex:0 0 100px"><option>High</option><option selected>Medium</option><option>Low</option></select><button class="b">Add</button></form>
${l.length?l.map(t=>`<div class="c row sp"><label class="row"><input type="checkbox" ${t.done?'checked':''} onchange="tog('tasks','${t.id}','done')"><span class="${t.done?'done':''}">${E(t.title)}</span><span class="tag">${E(t.tag)}</span><span class="tag ${t.pri}">${t.pri}</span></label><button class="x" onclick="del('tasks','${t.id}')">✕</button></div>`).join(''):empty('No tasks here yet')}</div>`}
function addTask(e){e.preventDefault();S.tasks.unshift({id:uid(),title:$('#tt').value.trim(),tag:$('#tg').value.trim()||'General',pri:$('#tp').value,done:false});save();render();toast('Task added')}

function v_planner(){return `<div class="stack">${head('Academic Planner','Weekly class timetable and study schedule.','<button class="b" onclick="addBlock()">+ Add Time Block</button>')}<div class="g7">${DAYS.map((d,i)=>{const b=S.blocks.filter(x=>x.day===d);return `<div class="c ${i===TI?'today':''}"><b>${d}</b>${b.length?b.map(x=>`<div class="mini row sp"><div><small class="mut">${E(x.time)}</small><div>${E(x.title)}</div></div><button class="x" onclick="del('blocks','${x.id}')">✕</button></div>`).join(''):'<div class="mut">No sessions</div>'}</div>`}).join('')}</div></div>`}
const addBlock=()=>form('Add time block',[{k:'day',l:'Day',o:DAYS},{k:'time',l:'Time',v:'10:00 - 11:30'},{k:'title',l:'Session title',p:'Algorithms lecture'}],v=>S.blocks.push({id:uid(),...v}));

function v_subjects(){const s=S.subjects.find(x=>x.id===S.sub)||S.subjects[0];if(s)S.sub=s.id;const n=s&&(s.notes.find(x=>x.id===S.note)||s.notes[0]);if(n)S.note=n.id;
return `<div class="stack">${head('Subjects & Notes','Add subjects, take lecture notes and log study hours.','<button class="b" onclick="addSub()">+ Add Subject</button>')}
<div class="g">${S.subjects.length?S.subjects.map(x=>`<div class="c k ${x.id===S.sub?'sel':''}" onclick="S.sub='${x.id}';S.note=null;render()"><div class="row sp"><b class="acc">${E(x.code)}</b><span class="mut">${x.hrs}h</span></div><div>${E(x.name)}</div><div class="row sp"><small class="mut">${x.notes.length} notes</small><span><button class="lk" onclick="event.stopPropagation();hour('${x.id}')">+1h study</button><button class="x" onclick="event.stopPropagation();delSub('${x.id}')">✕</button></span></div></div>`).join(''):empty('No subjects yet. Add one or use the dashboard Classroom setup.')}</div>
${s?`<div class="split"><div class="c"><div class="row sp"><b>${E(s.code)} notes</b><button class="b g" onclick="newNote('${s.id}')">+ New</button></div>${s.notes.map(x=>`<div class="mini k ${x.id===S.note?'sel':''}" onclick="S.note='${x.id}';render()">${E(x.title)}<br><small class="mut">Updated ${E(x.upd)}</small></div>`).join('')}</div>
<div class="c stack">${n?`<div class="row"><input class="i" id="nt" value="${E(n.title)}" style="flex:1"><button class="b" onclick="saveNote('${s.id}','${n.id}')">Save</button><button class="x" onclick="delNote('${s.id}','${n.id}')">✕</button></div><textarea class="i" id="nb" rows="12">${E(n.body)}</textarea>`:'<div class="mut">Select or create a note.</div>'}</div></div>`:''}</div>`}
const addSub=()=>form('Create subject',[{k:'code',l:'Course code',p:'CS101'},{k:'name',l:'Subject name',p:'Intro to Computer Science'}],v=>{const s={id:uid(),code:v.code.toUpperCase(),name:v.name,hrs:0,notes:[{id:uid(),title:'Syllabus',upd:today(),body:`# ${v.name}\n\n`}]};S.subjects.push(s);S.sub=s.id;S.note=null});
const delSub=i=>{S.subjects=S.subjects.filter(x=>x.id!==i);S.sub=null;save();render();toast('Subject deleted')},hour=i=>{const s=S.subjects.find(x=>x.id===i);s.hrs=+(s.hrs+1).toFixed(1);save();render();toast(`+1h logged to ${s.code}`)};
function newNote(i){const s=S.subjects.find(x=>x.id===i),n={id:uid(),title:'New lecture note',upd:today(),body:'# Summary\n\n'};s.notes.unshift(n);S.note=n.id;save();render()}
function saveNote(si,ni){const n=S.subjects.find(x=>x.id===si).notes.find(x=>x.id===ni);n.title=$('#nt').value.trim()||'Untitled';n.body=$('#nb').value;n.upd=today();save();render();toast('Note saved')}
function delNote(si,ni){const s=S.subjects.find(x=>x.id===si);s.notes=s.notes.filter(x=>x.id!==ni);S.note=null;save();render()}

function v_assignments(){return `<div class="stack">${head('Assignments','Coursework deliverables and submission status.','<button class="b" onclick="addAsg()">+ Add Assignment</button>')}<div class="c tw"><table><tr><th>Deliverable</th><th>Subject</th><th>Due</th><th>Status</th><th></th></tr>${S.asg.length?S.asg.map(a=>`<tr><td>${E(a.title)}</td><td><b class="acc">${E(a.sub)}</b></td><td>${E(a.due)}</td><td><select class="i" onchange="asgSt('${a.id}',this.value)">${['Not Started','In Progress','Submitted'].map(o=>`<option ${a.st===o?'selected':''}>${o}</option>`).join('')}</select></td><td><button class="x" onclick="del('asg','${a.id}')">✕</button></td></tr>`).join(''):'<tr><td colspan="5" class="mut">No assignments yet.</td></tr>'}</table></div></div>`}
const addAsg=()=>form('Add assignment',[{k:'title',l:'Title',p:'Homework #1'},{k:'sub',l:'Subject code',p:'CS301'},{k:'due',l:'Due date',t:'date'}],v=>S.asg.unshift({id:uid(),title:v.title,sub:v.sub.toUpperCase(),due:v.due,st:'Not Started'}));
function asgSt(i,v){S.asg.find(x=>x.id===i).st=v;save();toast('Status updated');if(v==='Submitted')boom()}

function v_habits(){return `<div class="stack">${head('Habits','Daily routines and streaks. Ticks reset every Monday.')}<form class="c row" onsubmit="addHabit(event)"><input class="i" id="hn" required placeholder="New daily habit…" style="flex:1 1 200px"><button class="b">+ Add Habit</button></form>
<div class="c tw"><table><tr><th>Habit</th>${DAYS.map((d,i)=>`<th class="${i===TI?'tdy':''}">${d}</th>`).join('')}<th>Streak</th><th></th></tr>${S.habits.map(h=>`<tr><td>${E(h.name)}</td>${h.days.map((o,i)=>`<td class="${i===TI?'tdy':''}"><button class="hc ${o?'on':''}" onclick="hab('${h.id}',${i})">${o?'✓':''}</button></td>`).join('')}<td>🔥 ${streak(h)}d</td><td><button class="x" onclick="del('habits','${h.id}')">✕</button></td></tr>`).join('')}</table></div></div>`}
function hab(i,d){const h=S.habits.find(x=>x.id===i);h.days[d]=!h.days[d];save();render();if(h.days[d])boom()}
function addHabit(e){e.preventDefault();S.habits.push({id:uid(),name:$('#hn').value.trim(),days:Array(7).fill(false)});save();render();toast('Habit added')}

function v_skills(){return `<div class="stack">${head('Skill Development','Deliberate practice and mastery tracks.','<button class="b" onclick="addSkill()">+ New Skill Track</button>')}<div class="g">${S.skills.length?S.skills.map(k=>`<div class="c stack"><div class="row sp"><span class="tag">${lvl(k.p)}</span><span class="mut">${k.hrs} hrs <button class="x" onclick="del('skills','${k.id}')">✕</button></span></div><h3>${E(k.name)}</h3><div class="mut">Focus: ${E(k.mod)}</div>${bar(k.p)}<button class="b g" onclick="practice('${k.id}')">+ Log 1.5h practice</button></div>`).join(''):empty('No skill tracks yet.')}</div></div>`}
const addSkill=()=>form('New skill track',[{k:'name',l:'Skill',p:'Advanced TypeScript'},{k:'mod',l:'Current focus',p:'Generics'}],v=>S.skills.push({id:uid(),name:v.name,mod:v.mod,hrs:0,p:5}));
function practice(i){const k=S.skills.find(x=>x.id===i);k.hrs=+(k.hrs+1.5).toFixed(1);k.p=Math.min(100,k.p+5);save();render();boom()}

function v_goals(){return `<div class="stack">${head('Goals','Long-term objectives and milestones.','<button class="b" onclick="addGoal()">+ Create Goal</button>')}<div class="g">${S.goals.length?S.goals.map(g=>{const d=g.ms.filter(m=>m.done).length;return `<div class="c stack"><div class="row sp"><h3>${E(g.title)}</h3><button class="x" onclick="del('goals','${g.id}')">✕</button></div><small class="mut">Deadline: ${E(g.due||'none')}</small>${bar(g.ms.length?d/g.ms.length*100:0)}${g.ms.map(m=>`<label class="row"><input type="checkbox" ${m.done?'checked':''} onchange="gm('${g.id}','${m.id}')"><span class="${m.done?'done':''}">${E(m.t)}</span></label>`).join('')}</div>`}).join(''):empty('No goals yet.')}</div></div>`}
const addGoal=()=>form('Create goal',[{k:'title',l:'Objective',p:'Maintain a 3.9 GPA'},{k:'due',l:'Deadline',t:'date',r:false},{k:'ms',l:'Milestones (comma separated)',p:'Midterm, Final project'}],v=>S.goals.push({id:uid(),title:v.title,due:v.due,ms:v.ms.split(',').map(s=>s.trim()).filter(Boolean).map(t=>({id:uid(),t,done:false}))}));
function gm(g,m){const x=S.goals.find(a=>a.id===g).ms.find(a=>a.id===m);x.done=!x.done;save();render();if(x.done)boom()}

function v_journal(){const a=S.journal.find(x=>x.id===S.jr)||S.journal[0];if(a)S.jr=a.id;
return `<div class="stack">${head('Journal','Daily reflection and mindset logs.','<button class="b" onclick="newJ()">+ New Entry</button>')}<div class="split"><div class="stack">${S.journal.length?S.journal.map(x=>`<div class="c k ${x.id===S.jr?'sel':''}" onclick="S.jr='${x.id}';render()"><div class="row sp"><small class="mut">${E(x.date)}</small><b class="acc">${E(x.mood)}</b></div>${E(x.title)}</div>`).join(''):empty('No entries yet')}</div>
<div class="c stack">${a?`<div class="row"><input class="i" id="jt" value="${E(a.title)}" style="flex:2 1 160px"><select class="i" id="jm" style="flex:1 1 110px">${['Focused','Energized','Calm','Reflective'].map(m=>`<option ${a.mood===m?'selected':''}>${m}</option>`).join('')}</select></div><label>Wins and progress<textarea class="i" id="jw" rows="8">${E(a.wins)}</textarea></label><div class="row"><button class="b" onclick="saveJ('${a.id}')">Save</button><button class="x" onclick="del('journal','${a.id}')">✕ Delete</button></div>`:'<div class="mut">Create an entry to start.</div>'}</div></div></div>`}
function newJ(){const e={id:uid(),date:today(),mood:'Focused',title:'Daily review',wins:''};S.journal.unshift(e);S.jr=e.id;save();render()}
function saveJ(i){const e=S.journal.find(x=>x.id===i);e.title=$('#jt').value.trim()||'Reflection';e.mood=$('#jm').value;e.wins=$('#jw').value;save();render();toast('Journal saved')}

function v_analytics(){const dn=S.tasks.filter(t=>t.done).length,tp=S.tasks.length?Math.round(dn/S.tasks.length*100):0,hp=S.habits.length?Math.round(S.habits.reduce((s,h)=>s+h.days.filter(Boolean).length,0)/(S.habits.length*7)*100):0,mx=Math.max(1,...S.subjects.map(s=>s.hrs));
return `<div class="stack">${head('Analytics','Productivity and study metrics.')}<div class="g"><div class="c"><h3>Study hours by subject</h3>${S.subjects.length?S.subjects.map(s=>`<div class="mini"><div class="row sp"><span>${E(s.code)}</span><span>${s.hrs}h</span></div>${bar(s.hrs/mx*100)}</div>`).join(''):'<div class="mut">No subjects logged.</div>'}</div>
<div class="c stack"><h3>Completion</h3><div>Tasks done ${tp}%</div>${bar(tp)}<div>Habits this week ${hp}%</div>${bar(hp)}</div>
<div class="c stack"><h3>Assignments</h3>${['Not Started','In Progress','Submitted'].map(x=>`<div class="row sp"><span>${x}</span><b>${S.asg.filter(a=>a.st===x).length}</b></div>`).join('')}</div></div></div>`}

function v_settings(){return `<div class="stack" style="max-width:640px">${head('Settings','Profile, theme and data.')}
<form class="c stack" onsubmit="saveSet(event)"><h3>Profile</h3><label>Display name<input class="i" id="sn" required value="${E(S.set.name)}"></label><label>Term<input class="i" id="st" required value="${E(S.set.term)}"></label><label>Weekly study target (hours)<input class="i" id="sw" type="number" min="1" value="${S.set.target}"></label><div><button class="b">Save profile</button></div></form>
<div class="c stack"><h3>Appearance</h3><div class="row">${['auto','light','dark'].map(t=>`<button class="b ${S.set.theme===t?'':'g'}" onclick="S.set.theme='${t}';save();render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
<div class="row">${[['indigo','#6366f1'],['emerald','#10b981'],['violet','#8b5cf6'],['amber','#f59e0b'],['rose','#f43f5e']].map(([a,h])=>`<button class="dot" title="${a}" style="background:${h};${S.set.accent===a?'box-shadow:0 0 0 3px var(--bg),0 0 0 6px '+h:''}" onclick="S.set.accent='${a}';save();render()"></button>`).join('')}</div></div>
<div class="c stack"><h3>Data</h3><div class="mut">Everything is saved in this browser only.</div><div><button class="b g" onclick="reset()">Reset all data</button></div></div></div>`}
function saveSet(e){e.preventDefault();S.set.name=$('#sn').value.trim();S.set.term=$('#st').value.trim();S.set.target=Math.max(1,+$('#sw').value||25);save();render();toast('Settings saved')}
let rs=0;function reset(){if(!rs){rs=1;toast('Press Reset again to confirm');setTimeout(()=>rs=0,4000);return}try{localStorage.removeItem(KEY)}catch(e){}S=structuredClone(D);S.week=wk;rs=0;anim=true;render();toast('All data cleared')}

const V={dashboard:v_dashboard,tasks:v_tasks,planner:v_planner,subjects:v_subjects,assignments:v_assignments,habits:v_habits,skills:v_skills,goals:v_goals,journal:v_journal,analytics:v_analytics,settings:v_settings};
function render(){const H=document.documentElement;H.dataset.accent=S.set.accent;if(S.set.theme==='auto')H.removeAttribute('data-theme');else H.dataset.theme=S.set.theme;
$('#nav').innerHTML=NAV.map(([k,e,l])=>`<button class="nv ${S.route===k?'on':''}" onclick="go('${k}')">${e} ${l}</button>`).join('');
$('#ht').textContent=NAV.find(n=>n[0]===S.route)[2];$('#tb').textContent=S.set.term;$('#un').textContent=S.set.name;$('#av').textContent=(S.set.name||'A')[0].toUpperCase();
const m=$('#main');m.innerHTML=V[S.route]();if(anim){m.querySelectorAll('.c').forEach((c,i)=>{c.style.setProperty('--i',Math.min(i,12));c.classList.add('pop-in')});anim=false}}
$('#dt').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
$('#doodles').innerHTML=['⭐','✏️','📚','☁️','💡','🚀','🎨'].map((e,i)=>`<span style="left:${(i*15+5)%95}%;top:${(i*23+10)%85}%;animation-delay:${-i*1.3}s">${e}</span>`).join('');
render();
</script></body></html>
